name: Check plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run check
      - run: npm pack --dry-run --ignore-scripts
